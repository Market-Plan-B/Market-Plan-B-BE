version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: market-plan-b-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: market-plan-b-backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT}
      MODEL: ${MODEL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      STABILITY_API_KEY: ${STABILITY_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEBUG: ${DEBUG}
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./data:/app/data
    # Playwright / Chromium / Selenium 이 메모리를 넉넉히 쓰도록
    shm_size: "1gb"

volumes:
  postgres_data: